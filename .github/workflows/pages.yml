name: Deploy published site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksa-static-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved site
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check published entry points
        run: |
          test -s docs/index.html
          test -s docs/research/index.html
          test -s docs/research/phase2.html
          test -s docs/progress/index.html
      - name: Upload published files
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
